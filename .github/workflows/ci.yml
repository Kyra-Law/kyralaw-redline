name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest

  container:
    # A clean Linux machine with nothing but this repository: the library and its tests
    # must pass with no network once the image is built, and with no other codebase
    # installed. Building the image also fetches kyralaw-redline-bench at the pinned
    # revision and checks every file; scoring it takes ~45 minutes, so CI skips that.
    # See the Dockerfile and scripts/verify.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kyralaw-redline .
      - run: docker run --rm --network none -e KYRALAW_BENCH=skip kyralaw-redline
